name: AI-OS Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Node 22+ required: src/mcp/shared/state-db.js uses node:sqlite
          # (DatabaseSync), which is only stable from Node 22.5+.
          node-version: '22'

      - name: Install root workspace dependencies
        run: npm ci --ignore-scripts

      - name: Install MCP server dependencies
        run: |
          for dir in src/mcp/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing $dir"
              npm install --prefix "$dir" --ignore-scripts 2>/dev/null || true
            fi
          done

      # E-235 (D-061 §3): browsers are installed EXPLICITLY here, because `ai install` no
      # longer downloads them. Cached on the Playwright version so this is a download once
      # per version rather than once per run — the unbounded fetch is exactly what made the
      # installer unusable on a developer machine.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/mcp/vibe-check-mcp/package.json') }}

      - name: Install Playwright Chromium (explicit, not part of ai install)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: src/mcp/vibe-check-mcp
        run: npx playwright install --with-deps chromium

      # Populate ~/.ai-os/ so mirror byte-identity tests (diff against
      # ${HOME}/.ai-os/...) and install-dependent suites have the framework
      # environment they assume. Without this, the suite is not CI-portable.
      # The installer is a non-interactive thin copier (src/ -> ~/.ai-os/).
      - name: Install AI-OS framework
        run: bash install-ai-os.sh

      # D-058 asked for the E-221 patch driver modes to be confirmed under GNU patch.
      # Printing the version puts that evidence in the log rather than leaving it assumed:
      # the runner ships GNU patch 2.7.x, whereas macOS development machines have Apple
      # patch 2.0, and the two differ in exit codes and --dry-run behaviour.
      - name: Record toolchain versions
        run: |
          patch --version | head -1
          node --version
          bash --version | head -1

      # `shell: bash` is REQUIRED here, not cosmetic. The default runner shell is
      # `bash -e {0}` with NO pipefail, so `run.sh | tee` reports TEE's exit status and a
      # failing suite passes the step silently. Naming the shell gets `-eo pipefail`.
      # This bit me in the first run of this very PR: 17 failures reported as a green job.
      - name: Run tests
        shell: bash
        run: bash tests/run.sh 2>&1 | tee test-run.log

      # Keep the log even when the suite fails — a red run is exactly the one worth reading.
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-log
          path: test-run.log
          retention-days: 14

      - name: Check .gitignore covers secrets
        run: |
          git check-ignore -v .env 2>/dev/null || { echo ".env not in .gitignore"; exit 1; }
          git check-ignore -v node_modules 2>/dev/null || { echo "node_modules not in .gitignore"; exit 1; }
        continue-on-error: false

  # E-206 added a node:test unit layer under tests/unit/. It runs inside the shell suite
  # too, but as its own job it reports separately and carries Node's built-in coverage,
  # so a unit regression is not buried in a 4000-assertion shell log.
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install root workspace dependencies
        run: npm ci --ignore-scripts

      - name: Run node:test unit layer with coverage
        env:
          UNIT_COVERAGE: '1'
        run: bash tests/suites/node_unit_test.sh
